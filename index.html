<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11100e">
<title>Jugs &amp; Mugs Staff Hub</title>
<style>
:root{color-scheme:dark;--bg:#10100f;--panel:#191816;--gold:#c9a45b;--gold2:#e5c77f;--muted:#aaa398;--line:#39352e;--white:#f7f3eb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#292318,transparent 48%),var(--bg);color:var(--white);font:15px/1.5 system-ui,sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,560px);padding:26px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}h1{font-size:21px;color:var(--gold2)}p{color:var(--muted)}#status{overflow-wrap:anywhere;color:var(--gold2);font-size:13px}
</style>
</head>
<body>
<main class="load"><section class="panel"><div style="color:#e5c77f;font-weight:800;letter-spacing:2px">JUGS &amp; MUGS</div><h1>Updating Staff Hub</h1><p id="status">Loading the original portal and applying the captain event-wage update…</p></section></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 const fail=m=>{status.textContent='Update failed: '+m+'. Do not delete your previous backup; restore it from GitHub history.'};
 try{
  const api='https://api.github.com/repos/paviguru13-png/Jugs-and-mugs-staffing/git/blobs/1764a4a712ba5dcc646dea71961b63542d8946c4';
  const response=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});
  if(!response.ok)throw new Error('Could not retrieve original app source (HTTP '+response.status+')');
  const blob=await response.json();
  if(blob.encoding!=='base64'||!blob.content)throw new Error('GitHub did not return the original app source');
  const binary=atob(blob.content.replace(/\s/g,''));
  const sourceBytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  let source=new TextDecoder('utf-8').decode(sourceBytes);
  const replaceOnce=(before,after,label)=>{
   const first=source.indexOf(before);
   if(first<0)throw new Error('Could not locate '+label+' in the original app');
   if(source.indexOf(before,first+before.length)>=0)throw new Error('Ambiguous match for '+label);
   source=source.slice(0,first)+after+source.slice(first+before.length);
  };
  replaceOnce(
   "const categoryName=c=>c==='bartender'?'Bartender':c==='clearance_boy'?'Clearance staff':'Other staff';",
   "const categoryName=c=>c==='bartender'?'Bartender':c==='clearance_boy'?'Clearance staff':c==='captain'?'Captain':'Other staff';",
   'staff category labels'
  );
  const helper=`async function ensureCaptainInEventRoster(eventId,captainId){if(!eventId||!captainId)return;const {data:captain,error:captainError}=await sb.from('staff_profiles').select('id,full_name').eq('id',captainId).single();if(captainError)throw captainError;if(!captain)return;const {data:existing,error}=await sb.from('event_staff').select('id').eq('event_id',eventId).eq('staff_category','captain').eq('staff_name',captain.full_name).limit(1);if(error)throw error;if(!existing?.length){const {error:insertError}=await sb.from('event_staff').insert({event_id:eventId,staff_name:captain.full_name,staff_category:'captain',created_by:profile.id});if(insertError)throw insertError}}\n`;
  const anchor='async function loadWages(eventId)';
  if(source.indexOf(anchor)<0||source.indexOf(anchor,source.indexOf(anchor)+anchor.length)>=0)throw new Error('Could not safely locate the existing wage functions');
  source=source.replace(anchor,helper+anchor);
  replaceOnce(
   "if(profile.role==='owner')loadWages(v.id);",
   "if(profile.role==='owner'){loadWages(v.id);sb.from('event_assignments').select('captain_id').eq('event_id',v.id).maybeSingle().then(({data,error})=>{if(!error&&data?.captain_id)ensureCaptainInEventRoster(v.id,data.captain_id).then(()=>{loadWages(v.id);loadEventStaff(v.id)}).catch(e=>showError('wageNotice','Could not add captain to wage roster: '+e.message))})}",
   'event wage loading'
  );
  replaceOnce(
   "if(cap){const add=await sb.from('event_assignments').insert({event_id:eid,captain_id:cap});if(add.error)throw add.error}clearEvent();await dashboard()",
   "if(cap){const add=await sb.from('event_assignments').insert({event_id:eid,captain_id:cap});if(add.error)throw add.error;await ensureCaptainInEventRoster(eid,cap)}clearEvent();await dashboard()",
   'event captain assignment save'
  );
  if(!source.includes("c==='captain'?'Captain'")||!source.includes('async function ensureCaptainInEventRoster'))throw new Error('Captain wage update verification failed');
  document.open();document.write(source);document.close();
 }catch(e){fail(e?.message||String(e))}
})();
</script>
</body>
</html>
